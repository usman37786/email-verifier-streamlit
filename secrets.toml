# secrets.toml - Streamlit Cloud reads this from the repo and surfaces it as
# st.secrets. app.py seeds the Settings tab from it on first session; the
# Settings tab still wins once you use it. Locally, if this file is missing,
# app.py falls back to its built-in defaults, so 'streamlit run app.py' just
# works.
#
# IMPORTANT: this file must be committed for Streamlit Cloud to see it, so in
# a PUBLIC repo these values are public. If you cannot accept that, commit the
# safe defaults below and enter real values through Streamlit Cloud's settings
# UI instead - same keys, same precedence.

# 'local' runs the pipeline in-process (safe default). 'api' sends every check
# to the Cloudflare Worker. Either way, no outbound port 25 means S6 stops at
# S5 with unknown - never a false invalid.
MODE = "local"

# Cloudflare Worker base URL, used when MODE = "api".
API_BASE = "https://email-verifier.<you>.workers.dev"
# Shared-secret gate for the /api/* REST endpoints. Auth is:
#   X-API-Key: ev_9b845a85cdcf4a687d3f85b63da645fe91cb
# or append  ?api_key=ev_9b845a85cdcf4a687d3f85b63da645fe91cb
# When this is empty the API is open (dev only). See server.py::_authorized().
API_KEY = "ev_9b845a85cdcf4a687d3f85b63da645fe91cb"

# smtp-probe service. Leave blank to attempt SMTP in-process.
SMTP_PROBE_URL = ""
PROBE_API_KEY = ""